<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>iNotes — Apple Style Notes & Checklist</title>
    <meta name="description" content="Aplikasi catatan & checklist elegan dengan filosofi Apple Design: fluid spring physics, gesture swipe, frosted glass materials, dan sinkronisasi lokal." />
    
    <!-- Apple Web App Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="iNotes" />
    <meta name="theme-color" content="#1c1c1e" id="theme-meta" />

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app" class="app-container">
      <!-- Background Ambient Glow -->
      <div class="ambient-glow glow-1"></div>
      <div class="ambient-glow glow-2"></div>

      <!-- Main Shell (3 Columns: Folders | Notes List | Editor) -->
      <div class="split-view" id="splitView">
        
        <!-- COLUMN 1: SIDEBAR (Folders & Settings) -->
        <aside class="sidebar frosted" id="sidebar">
          <div class="sidebar-header">
            <div class="window-controls">
              <span class="dot dot-close" title="Tutup"></span>
              <span class="dot dot-minimize" title="Perkecil"></span>
              <span class="dot dot-expand" title="Perbesar"></span>
            </div>
            <div class="brand">
              <span class="apple-badge">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 20h9"></path>
                  <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                </svg>
              </span>
              <span class="brand-text">iNotes</span>
            </div>
          </div>

          <div class="sidebar-section">
            <div class="section-title">Koleksi</div>
            <nav class="folder-list" id="folderList">
              <!-- Rendered via JS -->
            </nav>
          </div>

          <div class="sidebar-section">
            <div class="section-title">Tag & Status</div>
            <div class="tag-list" id="tagList">
              <button class="tag-pill active" data-filter="all">Semua</button>
              <button class="tag-pill" data-filter="pinned">Disematkan 📌</button>
              <button class="tag-pill" data-filter="todo">Ada Checklist ☑️</button>
            </div>
          </div>

          <!-- Bottom Sidebar Toolbar -->
          <div class="sidebar-footer">
            <button class="btn-subtle" id="btnToggleTheme" title="Ganti Tema (Gelap/Terang)">
              <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
              <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
              <span id="themeLabel">Gelap</span>
            </button>

            <button class="btn-subtle" id="btnToggleSound" title="Suara Haptic Apple (Web Audio)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              </svg>
              <span id="soundLabel">Suara: Nyala</span>
            </button>
          </div>
        </aside>

        <!-- COLUMN 2: NOTES LIST -->
        <section class="notes-panel frosted" id="notesPanel">
          <!-- Header with Search & New Button -->
          <div class="panel-header">
            <div class="panel-top-row">
              <button class="icon-btn-toggle" id="btnToggleSidebar" title="Tampilkan/Sembunyikan Sidebar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="9" y1="3" x2="9" y2="21"></line>
                </svg>
              </button>
              <h1 class="panel-title" id="currentFolderTitle">Semua Catatan</h1>
              <button class="btn-create" id="btnNewNote" title="Catatan Baru (Ctrl+N)">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Baru</span>
              </button>
            </div>

            <!-- Apple Search Bar -->
            <div class="search-box">
              <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="text" id="searchInput" placeholder="Cari catatan atau tugas..." autocomplete="off" />
              <button class="clear-search-btn" id="btnClearSearch" title="Hapus pencarian">&times;</button>
            </div>
            
            <div class="notes-count-meta" id="notesCountMeta">Memuat...</div>
          </div>

          <!-- Notes Scrollable List -->
          <div class="notes-scroll-area" id="notesListContainer">
            <!-- Dynamic Note Cards (with swipe-to-delete) -->
          </div>
        </section>

        <!-- COLUMN 3: NOTE EDITOR -->
        <main class="editor-panel frosted" id="editorPanel">
          <!-- Editor Top Bar -->
          <div class="editor-header">
            <div class="editor-actions-left">
              <button class="icon-btn mobile-back-btn" id="btnMobileBack" title="Kembali ke Daftar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                <span>Catatan</span>
              </button>

              <div class="status-indicator" id="saveStatus">
                <span class="status-dot"></span>
                <span class="status-text">Tersimpan</span>
              </div>
            </div>

            <!-- Apple Formatting Toolbar -->
            <div class="editor-toolbar" id="editorToolbar">
              <button class="tool-btn" data-action="bold" title="Tebal (Ctrl+B)"><b>B</b></button>
              <button class="tool-btn" data-action="italic" title="Miring (Ctrl+I)"><i>I</i></button>
              <button class="tool-btn" data-action="heading" title="Judul Besar">H1</button>
              <button class="tool-btn" data-action="subheading" title="Sub Judul">H2</button>
              <span class="tool-divider"></span>
              <button class="tool-btn tool-btn-checklist" data-action="add-checklist" title="Tambah Checklist Baru">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                  <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <span>+ Tugas</span>
              </button>
              <button class="tool-btn" data-action="bullet" title="Daftar Poin">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="8" y1="6" x2="21" y2="6"></line>
                  <line x1="8" y1="12" x2="21" y2="12"></line>
                  <line x1="8" y1="18" x2="21" y2="18"></line>
                  <line x1="3" y1="6" x2="3.01" y2="6"></line>
                  <line x1="3" y1="12" x2="3.01" y2="12"></line>
                  <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
              </button>
            </div>

            <div class="editor-actions-right">
              <button class="icon-btn" id="btnPinNote" title="Sematkan Catatan">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="17" x2="12" y2="22"></line>
                  <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.89A4 4 0 0 1 14 9V5a2 2 0 0 0-2-2h0a2 2 0 0 0-2 2v4a4 4 0 0 1-2.11 3.56l-1.78.89A2 2 0 0 0 5 15.24Z"></path>
                </svg>
              </button>
              
              <button class="icon-btn" id="btnExportNote" title="Bagikan / Ekspor Catatan">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="18" cy="5" r="3"></circle>
                  <circle cx="6" cy="12" r="3"></circle>
                  <circle cx="18" cy="19" r="3"></circle>
                  <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                  <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                </svg>
              </button>

              <button class="icon-btn icon-btn-danger" id="btnDeleteCurrentNote" title="Hapus Catatan">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
              </button>
            </div>
          </div>

          <!-- Note Content Body -->
          <div class="editor-content-wrap">
            <div class="note-meta-header">
              <span class="note-date" id="noteDateMeta">—</span>
              <span class="note-words" id="noteWordsMeta">— kata</span>
              <select class="folder-picker" id="noteFolderSelect" title="Pindahkan folder">
                <!-- Populated via JS -->
              </select>
            </div>

            <!-- Note Title -->
            <input type="text" class="note-title-input" id="noteTitleInput" placeholder="Judul Catatan..." />

            <!-- Interactive Checklist Section -->
            <div class="checklist-container" id="checklistSection">
              <div class="checklist-header">
                <div class="checklist-title-wrap">
                  <span class="checklist-title">Checklist & Tugas</span>
                  <span class="checklist-badge" id="checklistProgressBadge">0/0</span>
                </div>
                <button class="btn-subtle btn-add-check-item" id="btnAddCheckItem">+ Item Baru</button>
              </div>
              <div class="checklist-items" id="checklistItemsList">
                <!-- Checklist items injected via JS -->
              </div>
            </div>

            <!-- Freeform Rich Note Body -->
            <div class="note-body-editor" id="noteBodyEditor" contenteditable="true" placeholder="Mulai mengetik catatan, ide, atau kutipan di sini..."></div>
          </div>
        </main>

      </div>

      <!-- Export / Share Toast & Modal -->
      <div class="apple-modal-overlay" id="exportModal">
        <div class="apple-modal frosted">
          <div class="modal-header">
            <h3>Ekspor & Bagikan Catatan</h3>
            <button class="modal-close" id="btnModalClose">&times;</button>
          </div>
          <div class="modal-body">
            <p>Pilih format ekspor yang kamu butuhkan:</p>
            <div class="modal-actions-grid">
              <button class="modal-action-card" id="btnCopyMarkdown">
                <div class="modal-action-icon">📋</div>
                <div class="modal-action-title">Salin Markdown</div>
                <div class="modal-action-desc">Salin teks lengkap dengan format ke clipboard</div>
              </button>
              <button class="modal-action-card" id="btnDownloadMd">
                <div class="modal-action-icon">💾</div>
                <div class="modal-action-title">Unduh File .md</div>
                <div class="modal-action-desc">Simpan sebagai file catatan markdown lokal</div>
              </button>
              <button class="modal-action-card" id="btnPrintNote">
                <div class="modal-action-icon">🖨️</div>
                <div class="modal-action-title">Cetak / PDF</div>
                <div class="modal-action-desc">Cetak dokumen atau simpan sebagai PDF</div>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Notification Toast -->
      <div class="apple-toast" id="appleToast">
        <span class="toast-icon">✓</span>
        <span class="toast-message" id="toastMessage">Tersimpan</span>
      </div>

    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
